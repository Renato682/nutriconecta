<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/header :: header('Registrar Retirada')}"></head>

<body class="bg-light">

<div th:replace="~{fragments/menu :: body}"></div>

<div class="container mt-4 mb-5" style="max-width: 600px;">

    <div class="text-center mb-4">
        <i class="bi bi-box-seam-fill text-primary" style="font-size: 2.5rem;"></i>
        <h2 class="fw-bold mt-2 text-primary">Registrar Retirada</h2>
        <p class="text-muted">Confirme os dados da pessoa responsável pelo transporte.</p>
    </div>

    <form th:action="@{/retiradas/salvar}" th:object="${retirada}" method="post" class="card p-4 shadow-sm border-0 rounded-4 bg-white">

        <input type="hidden" th:field="*{id}">
        <input type="hidden" th:field="*{solicitacao.id}">

        <div class="mb-3">
            <label class="form-label fw-semibold text-muted">Responsável</label>
            <input type="text" class="form-control rounded-pill" th:field="*{responsavel}" placeholder="Nome do motorista/responsável" required>
        </div>

        <div class="mb-3">
            <label class="form-label fw-semibold text-muted">Data da Retirada</label>
            <input type="datetime-local" class="form-control rounded-pill" th:field="*{dataRetirada}" required>
        </div>

        <div class="mb-4">
            <label class="form-label fw-semibold text-muted">Observações</label>
            <textarea class="form-control rounded-4" th:field="*{observacoes}" rows="3" placeholder="Detalhes sobre a entrega (opcional)"></textarea>
        </div>

        <div class="d-flex justify-content-center gap-3 mt-2">
            <a href="/solicitacoes/listar" class="btn btn-outline-secondary rounded-pill px-4">Cancelar</a>
            <button type="submit" class="btn btn-primary rounded-pill px-4 shadow-sm">Registrar Retirada</button>
        </div>

    </form>
</div>

<footer th:replace="~{fragments/footer :: footer}"></footer>

</body>
</html>
