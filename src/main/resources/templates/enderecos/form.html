<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: header('Adicionar Novo Endereço')}"></head>

<body class="bg-light">

<div th:replace="~{fragments/menu :: body}"></div>

<div class="container mt-4 mb-5" style="max-width: 700px;">
    <div class="text-center mb-4">
        <i class="bi bi-map-fill text-primary" style="font-size: 2.5rem;"></i>
        <h2 class="fw-bold mt-2 text-primary">Adicionar Novo Endereço</h2>
        <p class="text-muted">Preencha as informações de localização para: <strong th:text="${usuario.nome}" class="text-primary"></strong></p>
    </div>

    <form th:action="@{/enderecos/salvar}" th:object="${endereco}" method="post" class="card p-4 shadow-sm border-0 rounded-4">
        <input type="hidden" th:field="*{id}">
        <input type="hidden" th:field="*{usuario.id}">

        <div class="row">
            <div class="col-md-6 mb-3">
                <label class="form-label fw-semibold text-muted">CEP</label>
                <input type="text" class="form-control rounded-pill" th:field="*{cep}" placeholder="00000-000" required>
            </div>
            <div class="col-md-6 mb-3">
                <label class="form-label fw-semibold text-muted">Número</label>
                <input type="text" class="form-control rounded-pill" th:field="*{numero}" placeholder="Ex: 123" required>
            </div>
        </div>

        <div class="mb-3">
            <label class="form-label fw-semibold text-muted">Logradouro (Rua, Avenida...)</label>
            <input type="text" class="form-control rounded-pill" th:field="*{logradouro}" placeholder="Ex: Rua das Flores" required>
        </div>

        <div class="mb-3">
            <label class="form-label fw-semibold text-muted">Bairro</label>
            <input type="text" class="form-control rounded-pill" th:field="*{bairro}" placeholder="Digite o bairro" required>
        </div>

        <div class="row">
            <div class="col-md-8 mb-3">
                <label class="form-label fw-semibold text-muted">Cidade</label>
                <input type="text" class="form-control rounded-pill" th:field="*{cidade}" placeholder="Sua cidade" required>
            </div>
            <div class="col-md-4 mb-3">
                <label class="form-label fw-semibold text-muted">Estado (UF)</label>
                <select class="form-select rounded-pill" th:field="*{estado}" required>
                    <option value="">Selecione...</option>
                    <option value="MA">Maranhão</option>
                    <option value="PI">Piauí</option>
                    <option value="CE">Ceará</option>
                    <option value="PA">Pará</option>
                </select>
            </div>
        </div>

        <div class="d-flex justify-content-center gap-3 mt-4">
            <a th:href="@{'/enderecos/usuario/' + ${usuario.id}}" class="btn btn-outline-secondary rounded-pill px-4">Cancelar</a>
            <button type="submit" class="btn btn-primary rounded-pill px-4 shadow-sm">Salvar Endereço</button>
        </div>
    </form>
</div>

<footer th:replace="~{fragments/footer :: footer}"></footer>
</body>
</html>
