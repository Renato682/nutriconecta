<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: header('Nova Solicitação')}"></head>
<body class="bg-light"> <div th:replace="~{fragments/menu :: body}"></div>

<div class="container mt-4" style="max-width: 600px;">
    <h2 class="mb-4 text-primary fw-bold text-center">Nova Solicitação de Doação</h2>

    <form th:action="@{/solicitacoes/salvar}" th:object="${solicitacao}" method="post" class="card p-4 shadow-sm border-0 rounded-4 bg-white">

        <div class="mb-3">
            <label class="form-label fw-semibold text-muted">Qual Instituição está pedindo?</label>
            <select class="form-select rounded-pill" th:field="*{instituicao.id}" required>
                <option value="">Selecione a Instituição...</option>
                <option th:each="inst : ${instituicoes}"
                        th:value="${inst.id}"
                        th:text="${inst.nome}">
                </option>
            </select>
        </div>

        <div class="mb-4">
            <label class="form-label fw-semibold text-muted">Qual Doação você quer solicitar?</label>
            <select class="form-select rounded-pill" th:field="*{doacao.id}" required>
                <option value="">Selecione a Doação...</option>
                <option th:each="d : ${doacoes}"
                        th:value="${d.id}"
                        th:text="${d.titulo}">
                </option>
            </select>
        </div>

        <div class="d-flex justify-content-center gap-3">
            <a href="/solicitacoes/listar" class="btn btn-outline-secondary rounded-pill px-4">Cancelar</a>
            <button type="submit" class="btn btn-primary rounded-pill px-4 shadow-sm">Salvar Solicitação</button>
        </div>
    </form>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
