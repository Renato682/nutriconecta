<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: header('Solicitações')}"></head>
<body class="bg-light">

<div th:replace="~{fragments/menu :: body}"></div>

<div class="container mt-4 mb-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="text-primary fw-bold">Solicitações</h2>
        <a href="/solicitacoes/nova" class="btn btn-primary rounded-pill shadow-sm px-4">Nova Solicitação</a>
    </div>

    <div class="card border-0 shadow-sm rounded-4 overflow-hidden">
        <div class="card-body p-0">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-primary text-primary">
                <tr>
                    <th class="ps-4">ID</th>
                    <th>Doação</th>
                    <th>Instituição</th>
                    <th>Status</th>
                    <th class="text-center pe-4">Ações</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="s : ${solicitacoes}">
                    <td class="ps-4 fw-bold text-muted" th:text="${s.id}"></td>

                    <td class="fw-semibold" th:text="${s.doacao?.titulo}"></td>
                    <td th:text="${s.instituicao?.nome}"></td>

                    <td>
                        <span class="badge rounded-pill px-3 py-2 shadow-sm"
                              th:classappend="${s.status?.name() == 'PENDENTE' ? 'bg-warning text-dark' :
                                               (s.status?.name() == 'APROVADA' ? 'bg-success' :
                                               (s.status?.name() == 'REJEITADA' ? 'bg-danger' : 'bg-secondary'))}"
                              th:text="${s.status?.descricao ?: 'SEM STATUS'}">
                        </span>
                    </td>

                    <td class="pe-4 py-3">
                        <div class="d-flex gap-2 justify-content-center">
                            <span th:if="${s.status?.name() == 'PENDENTE'}" class="d-flex gap-1">
                                <a th:href="@{'/solicitacoes/status/' + ${s.id} + '/APROVADA'}"
                                   class="btn btn-success btn-sm rounded-pill px-3 shadow-sm">
                                    Aprovar
                                </a>
                                <a th:href="@{'/solicitacoes/status/' + ${s.id} + '/REJEITADA'}"
                                   class="btn btn-danger btn-sm rounded-pill px-3 shadow-sm">
                                    Rejeitar
                                </a>
                            </span>

                            <a th:if="${s.status?.name() == 'APROVADA' and s.retirada == null}"
                               th:href="@{'/retiradas/registrar/' + ${s.id}}"
                               class="btn btn-primary btn-sm rounded-pill px-3 shadow-sm">
                                <i class="bi bi-box-seam"></i> Registrar Retirada
                            </a>

                            <span th:if="${s.status?.name() == 'APROVADA' and s.retirada != null}"
                                  class="badge rounded-pill bg-secondary px-3 py-2">
                                <i class="bi bi-check2-all"></i> Produto Retirado
                            </span>
                        </div>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<footer th:replace="~{fragments/footer :: footer}"></footer>
</body>
</html>
