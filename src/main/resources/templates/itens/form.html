<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: header('Adicionar Alimento')}"></head>

<body class="bg-light">
<div th:replace="~{fragments/menu :: body}"></div>

<div class="container mt-4 mb-5" style="max-width: 600px;">
    <div class="text-center mb-4">
        <i class="bi bi-cart-plus-fill text-primary" style="font-size: 2.5rem;"></i>
        <h2 class="fw-bold mt-2 text-primary">Adicionar Alimento à Doação</h2>
        <p class="text-muted">Doação: <strong th:text="${doacao.titulo}" class="text-dark"></strong></p>
    </div>

    <form th:action="@{/itens/salvar}" method="post" class="card p-4 shadow-sm border-0 rounded-4 bg-white">
        <input type="hidden" name="idDoacao" th:value="${doacao.id}">
        <input type="hidden" name="idItem" th:value="${item?.id}">

        <div class="mb-3">
            <label class="form-label fw-semibold text-muted">Nome do Alimento</label>
            <input type="text" name="nomeAlimento" class="form-control rounded-pill" th:value="${item?.alimento?.nome}" placeholder="Ex: Feijão Carioca" required>
            <div th:if="${item == null}" class="form-text text-primary mt-2 ms-2">
                <i class="bi bi-magic"></i> Se o alimento não existir, o sistema cria para você!
            </div>
        </div>

        <div class="row">
            <div class="col-md-6 mb-3">
                <label class="form-label fw-semibold text-muted">Categoria</label>
                <select name="categoriaAlimento" class="form-select rounded-pill" required>
                    <option value="">Selecione...</option>
                    <option value="Cereais e Grãos" th:selected="${item?.alimento?.categoria == 'Cereais e Grãos'}">Cereais e Grãos</option>
                    <option value="Laticínios" th:selected="${item?.alimento?.categoria == 'Laticínios'}">Laticínios</option>
                    <option value="Hortifruti" th:selected="${item?.alimento?.categoria == 'Hortifruti'}">Frutas e Legumes</option>
                    <option value="Proteínas" th:selected="${item?.alimento?.categoria == 'Proteínas'}">Proteínas (Carnes/Ovos)</option>
                    <option value="Outros" th:selected="${item?.alimento?.categoria == 'Outros'}">Outros</option>
                </select>
            </div>

            <div class="col-md-6 mb-3">
                <label class="form-label fw-semibold text-muted">Unidade de Medida</label>
                <select name="unidadeAlimento" class="form-select rounded-pill" required>
                    <option value="">Selecione...</option>
                    <option value="KG" th:selected="${item?.alimento?.unidadeMedida == 'KG'}">Quilogramas (KG)</option>
                    <option value="Unidade" th:selected="${item?.alimento?.unidadeMedida == 'Unidade'}">Unidades (Un)</option>
                    <option value="Litros" th:selected="${item?.alimento?.unidadeMedida == 'Litros'}">Litros (L)</option>
                </select>
            </div>
        </div>

        <div class="row">
            <div class="col-md-6 mb-4">
                <label class="form-label fw-semibold text-muted">Quantidade a Doar</label>
                <input type="number" step="0.1" name="quantidade" class="form-control rounded-pill" th:value="${item?.quantidade}" placeholder="Ex: 5" required>
            </div>

            <div class="col-md-6 mb-4">
                <label class="form-label fw-semibold text-muted">Data de Validade</label>
                <input type="date" name="validade" class="form-control rounded-pill" th:value="${item?.validade}" required>
            </div>
        </div>

        <div class="d-flex justify-content-center gap-3 mt-2">
            <a th:href="@{'/itens/doacao/' + ${doacao.id}}" class="btn btn-outline-secondary rounded-pill px-4">Cancelar</a>
            <button type="submit" class="btn btn-primary rounded-pill px-4 shadow-sm">Salvar Item</button>
        </div>
    </form>
</div>

<footer th:replace="~{fragments/footer :: footer}"></footer>
</body>
</html>
