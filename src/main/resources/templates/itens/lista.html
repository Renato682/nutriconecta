<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: header('Itens da Doação')}"></head>

<body class="bg-light">
<div th:replace="~{fragments/menu :: body}"></div>

<div class="container mt-4 mb-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="text-primary fw-bold"><i class="bi bi-basket"></i> Itens da Doação</h2>
        <div>
            <a href="/doacoes/listar" class="btn btn-outline-secondary rounded-pill me-2 px-3">Voltar</a>
            <a th:href="@{'/itens/novo/' + ${doacao.id}}" class="btn btn-primary rounded-pill shadow-sm px-3">Adicionar Alimento</a>
        </div>
    </div>

    <p class="text-muted mb-4">Doação: <strong th:text="${doacao.titulo}" class="text-dark"></strong></p>

    <div th:if="${#lists.isEmpty(itens)}" class="text-center my-5 p-5 border-0 shadow-sm rounded-4 bg-white">
        <i class="bi bi-cart-x text-muted" style="font-size: 3rem;"></i>
        <p class="text-muted mt-3">Esta doação ainda não possui alimentos detalhados.</p>
    </div>

    <div th:if="${!#lists.isEmpty(itens)}" class="card border-0 shadow-sm rounded-4 overflow-hidden">
        <div class="card-body p-0">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-primary text-primary">
                <tr>
                    <th class="ps-4">Alimento</th>
                    <th>Categoria</th>
                    <th>Quantidade</th>
                    <th>Unidade</th>
                    <th>Validade</th>
                    <th class="text-center pe-4">Ações</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="item : ${itens}">
                    <td class="ps-4 fw-semibold" th:text="${item.alimento.nome}"></td>
                    <td th:text="${item.alimento.categoria}"></td>
                    <td class="fw-bold text-primary" th:text="${item.quantidade}"></td>
                    <td th:text="${item.alimento.unidadeMedida}"></td>
                    <td th:text="${item.validade != null ? #temporals.format(item.validade, 'dd/MM/yyyy') : 'Sem Validade'}"></td>

                    <td class="d-flex gap-2 justify-content-center pe-4 py-3">
                        <a th:href="@{'/itens/editar/' + ${item.id}}" class="btn btn-warning btn-sm rounded-pill px-3 shadow-sm" title="Editar">
                            <i class="bi bi-pencil"></i> Editar
                        </a>
                        <a th:href="@{'/itens/deletar/' + ${item.id} + '/' + ${doacao.id}}"
                           class="btn btn-danger btn-sm rounded-pill px-3 shadow-sm"
                           title="Remover"
                           onclick="return confirm('Deseja realmente remover este alimento da doação?');">
                            <i class="bi bi-trash"></i> Remover
                        </a>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<footer th:replace="~{fragments/footer :: footer}"></footer>
</body>
</html>
